<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CineBOTrends — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0E0C09; --card:#171310; --line:#2a241a; --text:#F5F1E8; --muted:#948C79; --gold:#FFB000; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Hanken Grotesk", system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
    .brand { font-weight: 700; font-size: 16px; margin-bottom: 20px; }
    .brand .cine { color: var(--gold); }
    h1 { font-size: 18px; margin: 0 0 20px; }
    label { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 6px; }
    input {
      width: 100%; background: #15120c; border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--gold); }
    button {
      width: 100%; border: 1px solid var(--gold); background: var(--gold); color: #1a1305;
      border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .error {
      background: rgba(229,72,77,.1); border: 1px solid rgba(229,72,77,.4); color: #ff9a9d;
      border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="brand"><span class="cine">Cine</span>BOTrends <span style="color:var(--muted);font-weight:400">admin</span></div>
    <h1>Sign in</h1>
    <div class="error" id="err"></div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="btn">Sign in</button>
  </form>
  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var err = document.getElementById("err");
      var btn = document.getElementById("btn");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.style.display = "none";
        btn.disabled = true;
        btn.textContent = "Signing in…";
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("u").value,
            password: document.getElementById("p").value,
          }),
        })
          .then(function (res) {
            return res.json().then(function (data) {
              if (!res.ok) throw new Error(data.error || "Login failed");
              return data;
            });
          })
          .then(function () {
            var params = new URLSearchParams(location.search);
            location.href = params.get("next") || "/";
          })
          .catch(function (e) {
            err.textContent = e.message;
            err.style.display = "block";
            btn.disabled = false;
            btn.textContent = "Sign in";
          });
      });
    })();
  </script>
</body>
</html>
